name: Claude PR Otomasyonu

# Açık PR'larda iki iş yapar:
#   1. CI kırmızıya döndüğünde hatayı teşhis edip düzeltmeyi PR dalına iter.
#   2. PR yorumlarında "@claude" geçtiğinde isteği ele alır.
#
# Gereken depo secret'ı: ANTHROPIC_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) CI kırmızıysa otomatik düzelt
  # ---------------------------------------------------------------------------
  ci-autofix:
    name: CI hatasını düzelt
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: PR numarasını çöz
        id: pr
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Bu CI koşusuna bağlı açık bir PR yok, atlanıyor."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Depoyu çek
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      # Sonsuz döngü koruması: aynı dalda en fazla 3 otomatik düzeltme.
      - name: Döngü koruması
        if: steps.pr.outputs.found == 'true'
        id: guard
        run: |
          ATTEMPTS=$(git log origin/main..HEAD --grep='\[claude-autofix\]' --oneline | wc -l)
          echo "Bu dalda $ATTEMPTS otomatik düzeltme var."
          if [ "$ATTEMPTS" -ge 3 ]; then
            echo "Üst sınıra ulaşıldı, elle müdahale gerekiyor."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node kur
        if: steps.pr.outputs.found == 'true' && steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        if: steps.pr.outputs.found == 'true' && steps.guard.outputs.proceed == 'true'
        run: npm ci

      - name: Claude ile düzelt
        if: steps.pr.outputs.found == 'true' && steps.guard.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 25
          prompt: |
            VoidCoder-ux/Shiftt deposunda #${{ steps.pr.outputs.number }} numaralı PR'ın CI'ı kırmızıya döndü.
            Dal: ${{ github.event.workflow_run.head_branch }}
            Başarısız koşu: ${{ github.event.workflow_run.html_url }}

            Depo zaten bu dalda checkout edilmiş ve `npm ci` çalıştırılmış durumda.
            CI şu adımları sırayla çalıştırıyor: `npm run lint`, `npm test`, `npm run build`.

            YAPILACAKLAR:
            1. Yukarıdaki koşunun loglarını incele ve hangi adımın neden başarısız
               olduğunu teşhis et. Gerekirse komutları yerelde çalıştırıp tekrar üret.
            2. Hatayı düzelt. Mümkün olan EN KÜÇÜK değişikliği yap — PR'ın kapsamını
               genişletme, ilgisiz dosyalara dokunma, yeniden yapılandırma yapma.
            3. `npm run lint && npm test && npm run build` komutlarının üçünü de
               yerelde çalıştırıp geçtiğini DOĞRULA. Doğrulamadan commit etme.
            4. Değişikliği `${{ github.event.workflow_run.head_branch }}` dalına commit
               edip it. Commit mesajının ilk satırı `[claude-autofix]` ile başlasın
               (döngü koruması bunu sayıyor).

            HATA SENİN DEĞİLSE: Aynı hata `main` dalında da üretiliyorsa (yani PR'ın
            değişikliğinden kaynaklanmıyorsa) DÜZELTME. Bunun yerine PR'a kısa bir
            yorum yazıp durumu açıkla ve dur.

            DÜZELTEMEZSEN: Uydurma bir düzeltme itme. PR'a neyin başarısız olduğunu
            ve neden çözemediğini yazıp dur.

            KURALLAR:
            - `main` dalına doğrudan push etme, sadece PR dalına it.
            - Yeni PR açma.
            - Testleri veya lint kurallarını hatayı gizlemek için gevşetme/silme.
            - Yazdığın her GitHub yorumunun sonuna şunu aynen ekle:

              ---
              _Generated by [Claude Code](https://claude.ai/code)_

      - name: Üst sınır uyarısı
        if: steps.pr.outputs.found == 'true' && steps.guard.outputs.proceed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$(cat <<'EOF'
          Bu dalda 3 otomatik düzeltme denemesi yapıldı ve CI hâlâ kırmızı.
          Otomatik düzeltme durduruldu — elle inceleme gerekiyor.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )"

  # ---------------------------------------------------------------------------
  # 2) PR yorumlarına yanıt ver ("@claude" ile)
  # ---------------------------------------------------------------------------
  review-response:
    name: İnceleme yorumuna yanıt
    if: >
      github.event_name != 'workflow_run' &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Claude'u çalıştır
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          track_progress: true
          claude_args: |
            --model claude-opus-5
            --max-turns 20
          prompt: |
            Bir inceleme yorumunda senden bir şey istendi. İsteği ele al.

            Kod değiştirirsen, itmeden önce `npm run lint && npm test && npm run build`
            komutlarını çalıştırıp geçtiğini doğrula ve değişikliği PR'ın kendi dalına it.
            İsteği uygulamaman gerekiyorsa nedenini kısaca yorumda açıkla.

            Kapsamı genişletme — sadece istenen şeyi yap.
            `main` dalına doğrudan push etme, yeni PR açma.
            Yazdığın her yorumun sonuna şunu aynen ekle:

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
